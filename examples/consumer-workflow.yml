name: Example consumer

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm run build
      - name: A11yGuard
        uses: ./
        with:
          fail-on: error
          sticky-comment: true
          post-review: true
          upload-sarif: true
      # Optional Code Scanning upload:
      # - uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: .a11yguard/report.sarif
